<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css"/>
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <title>Poems Generator</title>
</head>
<body>
    <div class="container">
        <header>
            <h1>
                Welcome to AI Poems Generator!!!
            </h1>
        </header>

        <main>
            <form id="generator">
                <input type="text" placeholder="Enter the topic of the poem" autofocus required autocomplete="off" class="instruction" />
                <input type="submit" class="button"/>
            </form>
            <div class="poem" id="poem">
                Take me to the moon
                </br>
                To be among the stars
            </div>

            <script src="src/index.js"></script>
            <footer>
                This project was coded by <a href="https://www.shecodes.io/graduates/182572-khalea-mitchell">Khalea Mitchell</a> and
                is open sourced on <a href="https://github.com/KhaleaM/AI-poems-generator">GitHub</a> and is hosted on <a
                    href="https://app.netlify.com/projects/peaceful-boba-f1b5d0/overview">Netlify</a> 🌸
            </footer>
        </main>
    </div>
</body>
</html>
